name: MoonBit CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: moon version --all
      - name: Check all targets
        run: moon check --target all --deny-warn
      - name: Test WebAssembly and JavaScript
        run: |
          moon test --target wasm --deny-warn
          moon test --target js --deny-warn
      - name: Run CLI smoke tests
        run: |
          test "$(moon run --target wasm cmd/main -- sgtin-encode urn:epc:tag:sgtin-96:3.0614141.812345.6789)" = "3074257bf7194e4000001a85"
          test "$(moon run --target wasm cmd/main -- sgtin-decode 3074257bf7194e4000001a85)" = "urn:epc:tag:sgtin-96:3.0614141.812345.6789"
          test "$(moon run --target wasm cmd/main -- sscc-encode urn:epc:tag:sscc-96:0.123456789012.12345)" = "310072fa6468503039000000"
          test "$(moon run --target wasm cmd/main -- sscc-decode 310072fa6468503039000000)" = "urn:epc:tag:sscc-96:0.123456789012.12345"
          test "$(moon run --target wasm cmd/main -- sgln-encode urn:epc:tag:sgln-96:3.0614141.00123.456)" = "3274257bf400f600000001c8"
          test "$(moon run --target wasm cmd/main -- sgln-decode 3274257bf400f600000001c8)" = "urn:epc:tag:sgln-96:3.0614141.00123.456"
          test "$(moon run --target wasm cmd/main -- grai-encode urn:epc:tag:grai-96:5.0614141.81234.123456)" = "33b4257bf44f54800001e240"
          test "$(moon run --target wasm cmd/main -- grai-decode 33b4257bf44f54800001e240)" = "urn:epc:tag:grai-96:5.0614141.81234.123456"
          test "$(moon run --target wasm cmd/main -- giai-encode urn:epc:tag:giai-96:6.999999.123456789)" = "34dbd08fc0000000075bcd15"
          test "$(moon run --target wasm cmd/main -- giai-decode 34dbd08fc0000000075bcd15)" = "urn:epc:tag:giai-96:6.999999.123456789"
          test "$(moon run --target wasm cmd/main -- gdti-encode urn:epc:tag:gdti-96:3.0614141.12345.6789)" = "2c74257bf460720000001a85"
          test "$(moon run --target wasm cmd/main -- gdti-decode 2c74257bf460720000001a85)" = "urn:epc:tag:gdti-96:3.0614141.12345.6789"
          test "$(moon run --target wasm cmd/main -- encode urn:epc:tag:gdti-96:3.0614141.12345.6789)" = "2c74257bf460720000001a85"
          test "$(moon run --target wasm cmd/main -- decode 2c74257bf460720000001a85)" = "urn:epc:tag:gdti-96:3.0614141.12345.6789"
          inspect="$(moon run --target wasm cmd/main -- inspect 3074257bf7194e4000001a85)"
          printf '%s\n' "$inspect" | grep -Fx 'scheme=sgtin-96'
          printf '%s\n' "$inspect" | grep -Fx 'header=48'
          printf '%s\n' "$inspect" | grep -Fx 'filter=3'
          printf '%s\n' "$inspect" | grep -Fx 'partition=5'
          printf '%s\n' "$inspect" | grep -Fx 'company_prefix_digits=7'
          printf '%s\n' "$inspect" | grep -Fx 'bit_length=96'
          printf '%s\n' "$inspect" | grep -Fx 'tag_uri=urn:epc:tag:sgtin-96:3.0614141.812345.6789'
          test "$(moon run --target wasm cmd/main -- identity-encode 3 urn:epc:id:gdti:0614141.12345.6789)" = "2c74257bf460720000001a85"
          bits="$(moon run --target wasm cmd/main -- bits-encode urn:epc:tag:sgtin-96:3.0614141.812345.6789)"
          test "${#bits}" -eq 96
          test "$(moon run --target wasm cmd/main -- bits-decode "$bits")" = "urn:epc:tag:sgtin-96:3.0614141.812345.6789"
          if moon run --target wasm cmd/main -- bits-decode "01x"; then
            echo "invalid EPC bit string unexpectedly succeeded" >&2
            exit 1
          fi
          invalid_hex="00000000000000000000000x"
          output="$(moon run --target wasm cmd/main -- decode "$invalid_hex" 2>&1)" && { echo "invalid hex unexpectedly succeeded" >&2; exit 1; }
          test "$output" = "error: input contains a non-hexadecimal character"
          invalid_bits="$(printf '%096d' 0)"
          invalid_bits="x${invalid_bits:1}"
          output="$(moon run --target wasm cmd/main -- bits-decode "$invalid_bits" 2>&1)" && { echo "invalid bit string unexpectedly succeeded" >&2; exit 1; }
          test "$output" = "error: input contains a non-binary character"
          short_bits="$(printf '%095d' 0)"
          output="$(moon run --target wasm cmd/main -- bits-decode "$short_bits" 2>&1)" && { echo "short bit string unexpectedly succeeded" >&2; exit 1; }
          test "$output" = "error: expected 96 bits, received 95"
          output="$(moon run --target wasm cmd/main -- identity-encode 8 urn:epc:id:gdti:0614141.12345.6789 2>&1)" && { echo "invalid filter unexpectedly succeeded" >&2; exit 1; }
          test "$output" = "error: invalid filter; expected 0..7"
          if printf '%s\n' "$output" | grep -F 'RuntimeError: unreachable'; then exit 1; fi
          output="$(moon run --target wasm cmd/main -- decode not-hex 2>&1)" && { echo "invalid EPC input unexpectedly succeeded" >&2; exit 1; }
          test "$output" = "error: expected 96 bits, received 28"
          if printf '%s\n' "$output" | grep -F 'RuntimeError: unreachable'; then exit 1; fi
